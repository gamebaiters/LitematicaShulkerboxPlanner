<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; }
  body {
    width: 1600px; height: 500px; overflow: hidden;
    background:
      radial-gradient(1200px 500px at 20% 0%, #3b2263 0%, transparent 60%),
      radial-gradient(900px 600px at 100% 100%, #1d4a5c 0%, transparent 55%),
      #120c1d;
    font-family: Inter, sans-serif; color: #fff;
    position: relative;
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size: 32px 32px;
  }
  .left { position: absolute; left: 80px; top: 48px; width: 800px; }
  .icon { width: 104px; height: 104px; image-rendering: pixelated; filter: drop-shadow(0 10px 30px rgba(160,96,224,.55)); }
  h1 {
    font-family: Silkscreen, monospace; font-weight: 700; font-size: 58px; line-height: 1; margin: 22px 0 16px; white-space: nowrap;
    letter-spacing: 1px;
    background: linear-gradient(90deg, #f3d9ff, #c98bff 55%, #8fd8ff);
    -webkit-background-clip: text; color: transparent;
  }
  .sub { font-size: 23px; font-weight: 500; color: #d8cce8; line-height: 1.4; }
  .sub b { color: #fff; }
  .badges { margin-top: 24px; display: flex; gap: 12px; }
  .badge {
    font-size: 17px; font-weight: 700; padding: 8px 14px; border-radius: 8px;
    background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14); color: #eee;
  }
  .badge.p { background: rgba(160,96,224,.25); border-color: rgba(201,139,255,.5); }
  .shots { position: absolute; right: -40px; top: 40px; width: 820px; height: 460px; perspective: 1600px; }
  .shot {
    position: absolute; border-radius: 10px; overflow: hidden;
    box-shadow: 0 30px 60px rgba(0,0,0,.55), 0 0 0 2px rgba(201,139,255,.35);
    background-size: cover; background-position: center;
  }
  .s1 { width: 620px; height: 349px; left: 170px; top: 10px; transform: rotateY(-16deg) rotateX(4deg); background-image: url(shot_a.png); }
  .s2 { width: 470px; height: 264px; left: 40px; top: 190px; transform: rotateY(-16deg) rotateX(4deg); background-image: url(shot_b.png); }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="left">
    <img class="icon" src="icon.png">
    <h1>Shulker Planner</h1>
    <div class="sub">A <b>Litematica</b> addon that turns any material list into a<br><b>ready-to-fill shulker box plan</b> &mdash; with a packing assistant,<br>an in-game HUD and a to-do list.</div>
    <div class="badges">
      <span class="badge p">Fabric</span>
      <span class="badge">Minecraft 26.3</span>
      <span class="badge">Litematica 0.29+</span>
      <span class="badge">Client-side</span>
    </div>
  </div>
  <div class="shots">
    <div class="shot s1"></div>
    <div class="shot s2"></div>
  </div>
</body>
</html>
